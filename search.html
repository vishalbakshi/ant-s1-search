<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Anthropic S-1 search</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem 0; }
    .column { max-width: 60rem; margin: 0 auto; padding: 0 1rem; } /* controls and footer; the viewer spans the window */
    form, nav { display: flex; gap: 0.5rem; align-items: center; }
    input { flex: 1; min-width: 0; }
    #search { position: relative; }
    /* Example queries under the search box: tuned to the filing's wording in light green, plain in light yellow. */
    #examples { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; margin: 4px 0 0; padding: 6px;
                list-style: none; background: Canvas; border: 1px solid #8886; border-radius: 6px;
                box-shadow: 0 4px 12px #0003; max-height: 60vh; overflow: auto; }
    #examples .group { padding: 6px 4px 2px; font-size: 0.8em; opacity: 0.7; }
    #examples [role="option"] { margin: 2px 0; padding: 6px 8px; border-radius: 4px; color: #000; cursor: pointer; font-size: 0.9em; }
    #examples .tuned { background: #D7F5D7; }
    #examples .plain { background: #FFF5C2; }
    #examples [aria-selected="true"], #examples [role="option"]:hover { outline: 2px solid #0008; }
    nav { margin-bottom: 0.5rem; }
    #where { flex: 1; font-variant-numeric: tabular-nums; }
    #viewer { position: relative; height: 75vh; overflow: auto; background: #8883; border-block: 1px solid #8886; }
    .page { position: relative; margin: 0 auto 8px; background: #fff; box-shadow: 0 1px 3px #0004; }
    .page canvas { display: block; width: 100%; height: 100%; }
    /* Results in construction yellow: the current one solid, the rest faint. */
    .hit { position: absolute; background: #FFD10066; mix-blend-mode: multiply; cursor: pointer; }
    .hit.current { background: #FFD100; }
    .rank { position: absolute; transform: translate(-130%, -10%); font: bold 11px system-ui, sans-serif;
            background: #FFD100; color: #000; border-radius: 3px; padding: 1px 4px; cursor: pointer; }
    .rank.current { outline: 2px solid #000; }
  </style>
</head>
<body>
  <div class="column">
    <form id="search">
      <input id="query" type="search" placeholder="Search Anthropic's S-1" aria-label="Search Anthropic's S-1" required disabled>
      <button disabled>Search</button>
      <ul id="examples" role="listbox" aria-label="Example queries" hidden></ul>
    </form>
    <p id="status">Loading…</p>
    <nav>
      <button id="prev" disabled>Previous</button>
      <button id="next" disabled>Next</button>
      <span id="where"></span>
    </nav>
  </div>
  <div id="viewer"></div>
  <p class="column"><small>Source: <a href="https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm">Form S-1, Anthropic, PBC</a> on SEC EDGAR, printed to <a href="s1.pdf">s1.pdf</a>.</small></p>

  <script type="module">
    import init, { ColBERT } from "https://cdn.jsdelivr.net/npm/pylate-rs@1.0.4/pylate_rs.js";
    import * as pdfjs from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
    import { lookupTables, scoreChunks, topChunks } from "./scorer.js";
    import { ourVoice } from "./query.js";
    import { bm25 } from "./fts.js";
    import { rerank, rrf, vectorStore } from "./hybrid.js";
    import { EXAMPLES } from "./examples.js";

    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    // Order matches the ColBERT constructor arguments.
    const MODEL_FILES = [
      "model.safetensors",
      "1_Dense/model.safetensors",
      "tokenizer.json",
      "config.json",
      "config_sentence_transformers.json",
      "1_Dense/config.json",
      "special_tokens_map.json",
    ];
    const TOP_K = 5;
    const FUSE_DEPTH = 100; // each list's results that go into the fusion
    const RERANK = 50; // fused results reranked with full-precision vectors

    const form = document.querySelector("#search");
    const input = document.querySelector("#query");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const viewer = document.querySelector("#viewer");
    const prev = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const where = document.querySelector("#where");

    const say = (text) => (status.textContent = text);
    const mb = (bytes) => (bytes / 1e6).toFixed(0);

    // Example queries under the search box: opened by clicking the box or pressing the down arrow;
    // choosing one runs it. Typing, Escape, or leaving the box closes the list.
    const examples = document.querySelector("#examples");
    for (const [kind, label, k] of [["tuned", "Worded to match the filing", 0], ["plain", "Plain questions", 1]]) {
      examples.append(Object.assign(document.createElement("li"), { className: "group", textContent: label }));
      for (const pair of Object.values(EXAMPLES)) {
        const option = Object.assign(document.createElement("li"), { className: kind, textContent: pair[k] });
        option.setAttribute("role", "option");
        option.addEventListener("mousedown", (event) => {
          event.preventDefault(); // keep focus in the box
          pick(option);
        });
        examples.append(option);
      }
    }
    const options = [...examples.querySelectorAll('[role="option"]')];
    let active = -1; // option chosen with the arrow keys

    function setActive(i) {
      active = i;
      options.forEach((o, k) => o.setAttribute("aria-selected", k === i));
      options[i]?.scrollIntoView({ block: "nearest" });
    }
    const openExamples = () => (examples.hidden = false);
    function closeExamples() {
      examples.hidden = true;
      setActive(-1);
    }
    function pick(option) {
      input.value = option.textContent;
      closeExamples();
      form.requestSubmit();
    }
    input.addEventListener("click", openExamples);
    input.addEventListener("input", closeExamples);
    input.addEventListener("blur", closeExamples);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeExamples();
      } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        openExamples();
        const n = options.length;
        if (active < 0) setActive(event.key === "ArrowDown" ? 0 : n - 1);
        else setActive((active + (event.key === "ArrowDown" ? 1 : n - 1)) % n);
      } else if (event.key === "Enter" && !examples.hidden && active >= 0) {
        event.preventDefault();
        pick(options[active]);
      }
    });

    async function get(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
      return res;
    }

    async function download(url, onProgress) {
      const res = await get(url);
      const total = Number(res.headers.get("content-length")) || 0;
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        onProgress(received, total);
      }
      const bytes = new Uint8Array(received);
      let at = 0;
      for (const chunk of chunks) {
        bytes.set(chunk, at);
        at += chunk.length;
      }
      return bytes;
    }

    // Model files are pinned to a revision, so a cached copy never goes stale.
    async function modelFile(url, onProgress) {
      let cache;
      try {
        cache = await caches.open("ant-s1-search");
      } catch {
        // No Cache API (for example some private windows): download every visit.
      }
      const hit = await cache?.match(url);
      if (hit) return new Uint8Array(await hit.arrayBuffer());
      const bytes = await download(url, onProgress);
      await cache?.put(url, new Response(bytes)).catch(() => {}); // out of storage: just don't cache
      return bytes;
    }

    // The PDF viewer: one box per page, sized from the index, so the whole document can be laid out
    // and scrolled before any page is downloaded. Pages are drawn as they come into view.
    function pdfViewer(pdf, sizes) {
      const pages = sizes.map(([w, h], i) => {
        const div = document.createElement("div");
        div.className = "page";
        div.dataset.page = i;
        viewer.append(div);
        return { div, w, h, scale: 1, canvas: null, task: null };
      });

      // Every page, portrait or landscape, fills the viewer's width.
      function layout() {
        for (const p of pages) {
          p.scale = (viewer.clientWidth - 24) / p.w;
          p.div.style.width = `${p.w * p.scale}px`;
          p.div.style.height = `${p.h * p.scale}px`;
          clear(p);
        }
        for (const p of pages) if (visible.has(p)) draw(p);
      }

      function clear(p) {
        p.task?.cancel();
        p.task = null;
        p.canvas?.remove();
        p.canvas = null;
      }

      async function draw(p) {
        if (p.canvas) return;
        const canvas = (p.canvas = document.createElement("canvas"));
        const page = await pdf.getPage(Number(p.div.dataset.page) + 1);
        if (p.canvas !== canvas) return; // cleared while the page loaded
        const viewport = page.getViewport({ scale: p.scale * devicePixelRatio });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        p.div.prepend(canvas);
        p.task = page.render({ canvasContext: canvas.getContext("2d"), viewport });
        await p.task.promise.catch(() => {}); // cancelled
      }

      // Pages within a screen of the visible area are drawn; others are cleared to save memory.
      const visible = new Set();
      const observer = new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            const p = pages[e.target.dataset.page];
            if (e.isIntersecting) {
              visible.add(p);
              draw(p);
            } else {
              visible.delete(p);
              clear(p);
            }
          }
        },
        { root: viewer, rootMargin: "100% 0px" },
      );
      for (const p of pages) observer.observe(p.div);

      let width = viewer.clientWidth;
      new ResizeObserver(() => {
        if (viewer.clientWidth !== width) {
          width = viewer.clientWidth;
          layout();
        }
      }).observe(viewer);
      layout();

      return {
        // Highlights, replacing the old ones: [{ boxes, label }]; boxes are [page, left, top, right,
        // bottom] in PDF points, and a highlight may run onto the next page.
        highlight(hits, onClick) {
          viewer.querySelectorAll(".hit, .rank").forEach((el) => el.remove());
          // Puts `el` on page p with its top left at (l, t); clicking it selects highlight i.
          const place = (el, i, p, l, t) => {
            el.dataset.hit = i;
            el.style.left = `${(l / pages[p].w) * 100}%`;
            el.style.top = `${(t / pages[p].h) * 100}%`;
            el.addEventListener("click", () => onClick(i));
            pages[p].div.append(el);
          };
          hits.forEach((hit, i) => {
            for (const [p, l, t, r, b] of hit.boxes) {
              const box = document.createElement("div");
              box.className = "hit";
              box.style.width = `${((r - l) / pages[p].w) * 100}%`;
              box.style.height = `${((b - t) / pages[p].h) * 100}%`;
              place(box, i, p, l, t);
            }
            const [p, l, t] = hit.boxes[0];
            const tag = document.createElement("span");
            tag.className = "rank";
            tag.textContent = hit.label;
            place(tag, i, p, l, t);
          });
        },
        select(i, hit) {
          viewer.querySelectorAll(".hit, .rank").forEach((el) => el.classList.toggle("current", el.dataset.hit == i));
          const [p, , t] = hit.boxes[0];
          viewer.scrollTo({ top: pages[p].div.offsetTop + t * pages[p].scale - viewer.clientHeight / 4, behavior: "smooth" });
        },
      };
    }

    try {
      say("Loading the index…");
      const [docs, bits] = await Promise.all([
        get("data/docs.json").then((r) => r.json()),
        get("data/index.bin").then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b)),
      ]);
      const offsets = Int32Array.from(docs.offsets);

      // Only the pages being looked at are fetched, using range requests.
      const pdf = await pdfjs.getDocument({ url: "s1.pdf", disableAutoFetch: true, disableStream: true }).promise;
      const view = pdfViewer(pdf, docs.pages);

      const { repo, revision } = docs.model;
      const files = [];
      for (const name of MODEL_FILES) {
        const url = `https://huggingface.co/${repo}/resolve/${revision}/${name}`;
        files.push(await modelFile(url, (got, total) =>
          say(`Downloading the model (first visit only): ${name} ${mb(got)}${total ? ` of ${mb(total)}` : ""} MB`)));
      }
      say("Starting the model…");
      await init();
      const model = new ColBERT(...files, 32);

      const keyword = bm25(docs.chunks.map((c) => c.text));
      const vectors = vectorStore("data/vectors.f16", offsets, docs.dim);

      let hits = [];
      let current = 0;

      function show(i) {
        current = i;
        const hit = hits[i];
        const chunk = docs.chunks[hit.chunk];
        view.select(i, chunk);
        where.textContent = `Result ${i + 1} of ${hits.length}: page ${chunk.boxes[0][0] + 1}`;
        prev.disabled = i === 0;
        next.disabled = i === hits.length - 1;
      }
      prev.addEventListener("click", () => show(current - 1));
      next.addEventListener("click", () => show(current + 1));

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = input.value.trim();
        if (!query) return;
        button.disabled = true;
        say("Searching…");
        // Let "Searching…" appear before the encoding and scoring block the page. A timer, not
        // requestAnimationFrame, which never fires while the tab is hidden.
        await new Promise((resolve) => setTimeout(resolve, 50));

        try {
          const start = performance.now();
          const searched = ourVoice(query);
          const { embeddings } = model.encode({ sentences: [searched] }, true);
          const tables = lookupTables(Float32Array.from(embeddings[0].flat()), docs.dim);
          const colbert = topChunks(scoreChunks(tables, bits, offsets), FUSE_DEPTH);
          const words = keyword(searched, FUSE_DEPTH);
          const fused = rrf([colbert.map((h) => h.chunk), words.map((h) => h.chunk)], { depth: FUSE_DEPTH });
          hits = (await rerank(embeddings[0], fused.slice(0, RERANK).map((h) => h.chunk), vectors, docs.dim)).slice(0, TOP_K);
          const ms = performance.now() - start;
          view.highlight(hits.map((h, i) => ({ ...docs.chunks[h.chunk], label: i + 1 })), show);
          show(0);
          const as = searched === query ? "" : ` for “${searched}” (the filing calls Anthropic “we”)`;
          say(`Searched ${docs.chunks.length.toLocaleString()} chunks${as} in ${Math.round(ms)} ms.`);
        } catch (error) {
          say(`Search failed: ${error.message}`);
        } finally {
          button.disabled = false;
        }
      });

      input.disabled = button.disabled = false;
      input.focus();
      say(`Ready: ${docs.chunks.length.toLocaleString()} chunks from ${docs.pages.length} pages.`);
    } catch (error) {
      say(`Could not load: ${error.message}`);
      throw error;
    }
  </script>
</body>
</html>
